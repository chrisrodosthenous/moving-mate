<section class="driver-analytics dark" aria-labelledby="driver-analytics-heading">
  <div class="mb-4 flex flex-wrap items-end justify-between gap-3">
    <div>
      <h2 id="driver-analytics-heading" class="text-lg font-semibold text-foreground">
        This month
      </h2>
      <p class="mt-1 text-sm text-[#a8c4ec]">Last 30 days · €{{ weekEarningsTotal() }} earned</p>
    </div>
  </div>

  @if (loading()) {
    <p class="mb-4 text-sm text-[#a8c4ec]" aria-live="polite">Loading charts…</p>
  }

  <div class="grid grid-cols-1 gap-4 bg-background p-4 sm:gap-6 sm:p-6 lg:grid-cols-3">
    <article class="rounded-xl border border-accent/20 bg-accent/5 p-5 lg:col-span-3">
      <h3 class="text-sm font-semibold text-foreground">My Earnings</h3>
      <p class="mb-3 text-xs text-[#a8c4ec]">Daily earnings from your completed moves</p>
      <div class="relative h-64 w-full min-w-0">
        <canvas
          baseChart
          [type]="barChartType"
          [data]="earningsChartData()"
          [options]="earningsChartOptions"
          aria-label="Weekly earnings bar chart"
        ></canvas>
      </div>
    </article>
  </div>
</section>
